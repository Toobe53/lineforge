name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pybind11 headers
        run: python -m pip install --upgrade pybind11

      - name: Build native core
        run: python tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ runner.os }}-${{ runner.arch }}
          path: addon/lineforge/bin/**
          if-no-files-found: error

  package:
    name: package add-on
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: addon/lineforge/bin
          pattern: core-*
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Collect platform binaries
        run: find addon/lineforge/bin -name "lineforge_core.*" -print

      - name: Package zip
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: lineforge-addon
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
